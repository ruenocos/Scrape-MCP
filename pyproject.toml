[project]
name = "scrape-mcp"
version = "0.1.0"
description = "Local MCP server that scrapes websites, YouTube and Reddit into clean markdown for Claude."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "curl_cffi>=0.17",
    "trafilatura>=2.0",
    "yt-dlp[default,deno]>=2026.10.21",
    "youtube-transcript-api>=1.2.4",
    "bgutil-ytdlp-pot-provider>=2.0.2",
]

[project.scripts]
scrape-mcp = "scrape_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrape_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
